---
- name: Install required packages
  ansible.builtin.dnf:
    name:
      - wget
      - curl
      - unzip
      - ca-certificates
      - procps-ng
      - postgresql-server
      - postgresql
    state: present
    update_cache: true

- name: Check if PostgreSQL database is initialized
  ansible.builtin.stat:
    path: /var/lib/pgsql/data/PG_VERSION
  register: postgresql_initialized

- name: Initialize PostgreSQL database
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
  when: not postgresql_initialized.stat.exists

- name: Start and enable PostgreSQL
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

- name: Create SonarQube database user
  ansible.builtin.shell: |
    sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ sonarqube_db_user }}'" | grep -q 1 || \
    sudo -u postgres psql -c "CREATE USER {{ sonarqube_db_user }} WITH PASSWORD '{{ sonarqube_db_password }}';"
  args:
    executable: /bin/bash

- name: Create SonarQube database
  ansible.builtin.shell: |
    sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='{{ sonarqube_db_name }}'" | grep -q 1 || \
    sudo -u postgres psql -c "CREATE DATABASE {{ sonarqube_db_name }} OWNER {{ sonarqube_db_user }};"
  args:
    executable: /bin/bash

- name: Check Java 17 installation
  ansible.builtin.command:
    cmd: java -version
  register: java_check
  changed_when: false
  failed_when: false

- name: Download Java 17
  ansible.builtin.get_url:
    url: "https://corretto.aws/downloads/latest/amazon-corretto-17-x64-linux-jdk.tar.gz"
    dest: /tmp/amazon-corretto-17.tar.gz
    mode: "0644"
  when: java_check.rc != 0

- name: Create Java installation directory
  ansible.builtin.file:
    path: /opt/java17
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: java_check.rc != 0

- name: Extract Java 17
  ansible.builtin.unarchive:
    src: /tmp/amazon-corretto-17.tar.gz
    dest: /opt/java17
    remote_src: true
    extra_opts:
      - --strip-components=1
  when: java_check.rc != 0

- name: Configure JAVA_HOME
  ansible.builtin.copy:
    dest: /etc/profile.d/java17.sh
    mode: "0644"
    content: |
      export JAVA_HOME=/opt/java17
      export PATH=$JAVA_HOME/bin:$PATH

- name: Create Java symlink
  ansible.builtin.file:
    src: /opt/java17/bin/java
    dest: /usr/bin/java
    state: link
    force: true

- name: Verify Java 17
  ansible.builtin.command:
    cmd: /opt/java17/bin/java -version
  register: java_version
  changed_when: false

- name: Show Java version
  ansible.builtin.debug:
    msg: "{{ java_version.stderr }}"
